{{ define "main" }}
    <article class="essay essay--page" data-pagefind-body>
        {{ partial "essay/head.html" (dict "page" . "kicker" "Page") }}
        <div class="essay-body">
            <aside class="essay-side" data-pagefind-ignore>{{ partial "toc.html" . }}</aside>
            <div class="essay-main prose">{{ .Content }}</div>
        </div>
    </article>
{{ end }}
