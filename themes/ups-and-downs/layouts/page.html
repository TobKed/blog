{{ define "main" }}
    <article class="plain" data-pagefind-body>
        <h1 class="plain__title" data-pagefind-meta="title">{{ .Title }}</h1>
        {{ with .Params.summary }}<p class="plain__sub">{{ . }}</p>{{ end }}
        {{ if and site.Params.article.toc .Fragments.Headings }}
            <details class="toc" open>
                <summary>Contents</summary>
                <nav>{{ .TableOfContents }}</nav>
            </details>
        {{ end }}
        <hr class="post__rule">
        <div class="prose">{{ .Content }}</div>
    </article>
{{ end }}
