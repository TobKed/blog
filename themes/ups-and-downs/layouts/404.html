{{ define "main" }}
    <section class="listing-head">
        <h1 class="listing-head__title display">404</h1>
        <p class="listing-head__sub">That page is not here.</p>
    </section>
    <div class="listing">
        <ul class="listing-links">
            <li><a href="{{ site.Home.RelPermalink }}">Back to the front page <span aria-hidden="true">→</span></a></li>
            {{ with site.GetPage "/archives" }}<li><a href="{{ .RelPermalink }}">Browse the archives <span aria-hidden="true">→</span></a></li>{{ end }}
            {{ with site.GetPage "/search" }}<li><a href="{{ .RelPermalink }}">Search the blog <span aria-hidden="true">→</span></a></li>{{ end }}
        </ul>
    </div>
{{ end }}
