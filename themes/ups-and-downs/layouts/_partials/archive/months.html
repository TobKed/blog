{{- /* A year's round-ups as month chips. Context: {pages, alt}; alt is the
       stand-in for the cover grid, shown only while photos are off. */ -}}
{{- $n := len .pages -}}
<div class="amonths{{ if .alt }} amonths--alt{{ end }}" data-group>
    <span class="amonths__note">{{ $n }} round-up{{ if ne $n 1 }}s{{ end }}</span>
    <div class="amonths__grid">
        {{ range .pages }}<a href="{{ .RelPermalink }}" aria-label="{{ .Title }}" data-kind="roundup" data-title="{{ lower .Title }}">{{ .Date.Format "Jan" }}</a>{{ end }}
    </div>
</div>
