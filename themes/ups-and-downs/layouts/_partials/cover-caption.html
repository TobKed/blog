{{- /* The line under a cover, or nothing: the page's image_caption as written,
       e.g. where it was taken, or "Photo by …" for someone else's photo.
       Context: a Page. Markdown, so a credit can link out. */ -}}
{{- with .Params.image_caption }}<figcaption class="cover-cap">{{ . | markdownify }}</figcaption>{{ end -}}
