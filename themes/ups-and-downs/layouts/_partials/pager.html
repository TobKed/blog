{{- /* Context: a Pager. */ -}}
{{ if gt .TotalPages 1 }}
    <nav class="pager" aria-label="Pages">
        {{ with .Prev }}<a class="pager__link" href="{{ .URL }}" rel="prev">← Newer</a>{{ else }}<span></span>{{ end }}
        <span class="pager__pos">{{ .PageNumber }} / {{ .TotalPages }}</span>
        {{ with .Next }}<a class="pager__link" href="{{ .URL }}" rel="next">Older →</a>{{ else }}<span></span>{{ end }}
    </nav>
{{ end }}
