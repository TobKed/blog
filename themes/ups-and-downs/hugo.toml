# Theme defaults. Hugo merges these under the site's own configuration, so a
# site only has to state what it wants to change.
#
# The four layout choices below each take the same pair:
#   default  what a first-time visitor sees
#   toggle   whether the sidebar shows a button for it; a reader who presses it
#            has their choice remembered in their browser, which then wins

[params.colorScheme]
default = "auto"    # "auto" follows the operating system, or force "light" / "dark"
toggle = true

[params.coverImages]
default = "shown"   # "shown" or "hidden"; hidden images are never downloaded
toggle = true

[params.sidebarIndex]
default = "side"    # archives/categories/tags "side" of the posts, or "below" them
toggle = false

[params.postContents]
default = "inline"  # a post's Contents list "inline" in the post, or at its "side"
toggle = false      # params.article.toc = false drops the list altogether

[params.article]
toc = true            # build the Contents list
readingTime = true    # show "N min read"
headingAnchor = true  # add a # link beside each heading
