baseURL = 'https://blog.tobked.dev/'
locale = 'en-us'
defaultContentLanguage = 'en'
title = 'ups and downs'
theme = 'ups-and-downs'

# Monthly link posts are dated the last day of the month, so they sit in the
# future for most of that month. Pelican published them anyway
# (WITH_FUTURE_DATES defaults to true); without this, un-drafting one mid-month
# would silently produce nothing.
buildFuture = true

[pagination]
pagerSize = 10

# Pelican served posts at /<slug> and pages at /pages/<slug>. Keep both.
[permalinks.page]
post = '/:slug/'
pages = '/pages/:slug/'

[taxonomies]
category = "categories"
tag = "tags"

# Supplies the per-entry author in the RSS and Atom feeds (layouts/home.*.xml read
# .Params.author).
[[cascade]]
[cascade.params]
author = "Tobiasz Kedzierski"
[cascade.target]
path = '{/post/**,/pages/**}'

[params]
mainSections = ["post"]
description = "Tobiasz Kedzierski's Blog"

[params.footer]
since = 2018
customText = "Profile photo by <a href=\"https://juliakaczorowska.pl/\">Julia Kaczorowska</a> (other photos by me)."

avatar = "img/avatar.png"
tagline = "Python, Django, the cloud, and other interesting things — computer-related or not. Mostly monthly round-ups of what I've been doing, reading and watching."

[params.epigraph]
title = "Why “ups and downs”?"
text = "The game has its ups and downs, but you can never lose focus of your individual goals and you can't let yourself be beat because of lack of effort."
cite = "Michael Jordan"

[params.article]
headingAnchor = true
toc = true
readingTime = true

# Each takes `default` (what a first-time visitor sees) and `toggle` (whether
# the header offers a button, whose choice is remembered per reader).
[params.colorScheme]
default = "auto" # "auto" follows the operating system, or force "light" / "dark"
toggle = true

[params.coverImages]
default = "shown" # "shown" or "hidden"; hidden images are never downloaded
toggle = true

[params.linkSections]
foldAfter = 3        # 0 never folds
keepFirstOpen = true

# Ordered by weight; Hugo falls back to alphabetical order when weights are absent.
[[menu.main]]
identifier = "home"
name = "Home"
url = "/"
weight = 10
[[menu.main]]
identifier = "about"
name = "About me"
url = "/pages/about-me/"
weight = 20
[[menu.main]]
identifier = "links"
name = "Links"
url = "/pages/links/"
weight = 30
[[menu.main]]
identifier = "search"
name = "Search"
url = "/search/"
weight = 50
[[menu.main]]
identifier = "archives"
name = "Archives"
url = "/archives/"
weight = 40

[[menu.social]]
identifier = "tobked"
name = "tobked.dev"
url = "https://tobked.dev"
weight = 10
[menu.social.params]
newTab = true
[[menu.social]]
identifier = "email"
name = "Email"
url = "mailto:tobiaszkedzierski@gmail.com"
weight = 20
[[menu.social]]
identifier = "github"
name = "GitHub"
url = "https://github.com/TobKed"
weight = 25
[menu.social.params]
newTab = true
[[menu.social]]
identifier = "linkedin"
name = "LinkedIn"
url = "https://www.linkedin.com/in/tobiaszkedzierski/?locale=en_US"
weight = 30
[menu.social.params]
newTab = true
[[menu.social]]
identifier = "credly"
name = "Credly"
url = "https://www.credly.com/users/tobiasz-kedzierski"
weight = 40
[menu.social.params]
newTab = true
[[menu.social]]
identifier = "medium"
name = "Medium"
url = "https://tobiaszkedzierski.medium.com/"
weight = 50
[menu.social.params]
newTab = true
[[menu.social]]
identifier = "rss"
name = "RSS"
url = "/feeds/all.rss.xml"
weight = 60

[services]
[services.googleAnalytics]
# Set in CI via HUGO_SERVICES_GOOGLEANALYTICS_ID.
id = ""
[services.rss]
limit = 50

# Pelican published feeds/all.rss.xml and feeds/all.atom.xml - keep those URLs
# so existing subscribers don't break.
[mediaTypes]
[mediaTypes.'application/atom+xml']
suffixes = ['xml']

[outputFormats]
[outputFormats.RSS]
path = 'feeds'
baseName = 'all.rss'
rel = 'alternate'
[outputFormats.Atom]
mediaType = 'application/atom+xml'
path = 'feeds'
baseName = 'all.atom'
isPlainText = false
rel = 'alternate'

# content/search.md carries outputs: [html, json] for Stack's built-in search index.
[outputs]
home = ['html', 'rss', 'atom']
page = ['html']
section = ['html']
taxonomy = ['html']
term = ['html']

[markup]
[markup.goldmark.renderer]
unsafe = true
[markup.highlight]
noClasses = false
lineNos = false
[markup.tableOfContents]
startLevel = 2
endLevel = 2
