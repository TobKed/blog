app = "tobked-ssh-blog"
primary_region = "fra"

[[services]]
  internal_port = 2222
  protocol = "tcp"
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [services.concurrency]
    type = "connections"
    soft_limit = 80
    hard_limit = 100

  [[services.ports]]
    port = 22

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
