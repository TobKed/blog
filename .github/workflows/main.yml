name: Deploy blog to gh-pages

on:
  workflow_dispatch:
    inputs:
  pull_request:
  push:
    branches:
      - master

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .python-version
      # pre-commit/action uses an unpinned actions/cache inside, which the repository rejects
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.python-version', '.pre-commit-config.yaml') }}
      - run: pip install "$(grep -i '^pre-commit==' requirements.txt)"
      - run: pre-commit run --all-files --show-diff-on-failure --color always

  build:
    name: Deploy job
    runs-on: ubuntu-latest
    needs: [pre-commit]
    if: >
      github.ref == 'refs/heads/master' &&
      github.event_name == 'push'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Read Hugo version from mise.toml
      run: v=$(sed -n 's/^hugo-extended = "\(.*\)"/\1/p' mise.toml) && test -n "$v" && echo "HUGO_VERSION=$v" >> "$GITHUB_ENV"
    - name: Setup Hugo
      uses: peaceiris/actions-hugo@d1c81a15d4e6dca7086a17b9c2565cb70fd576bf  # v3.3.0
      with:
        hugo-version: ${{ env.HUGO_VERSION }}
        extended: true
    - name: Restore Hugo cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: |
          ${{ runner.temp }}/hugo_cache
          resources/_gen
        key: hugo-${{ github.run_id }}
        restore-keys: hugo-
    - name: Build site and search index
      run: make publish
      env:
        HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
    - name: Save Hugo cache
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: |
          ${{ runner.temp }}/hugo_cache
          resources/_gen
        key: hugo-${{ github.run_id }}
    - name: Deploy
      uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4.1.0
      with:
        github_token: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        publish_dir: ./public
        cname: blog.tobked.dev
