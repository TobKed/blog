name: Deploy blog to gh-pages

on:
  workflow_dispatch:
    inputs:
  pull_request:
  push:
    branches:
      - master

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd  # v3.0.1
        with:
          extra_args: --all-files --show-diff-on-failure --color always

  build:
    name: Deploy job
    runs-on: ubuntu-latest
    needs: [pre-commit]
    if: >
      github.ref == 'refs/heads/master' &&
      github.event_name == 'push'
    steps:
    - uses: actions/checkout@v6
    - name: Read Hugo version from mise.toml
      run: v=$(sed -n 's/^hugo-extended = "\(.*\)"/\1/p' mise.toml) && test -n "$v" && echo "HUGO_VERSION=$v" >> "$GITHUB_ENV"
    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: ${{ env.HUGO_VERSION }}
        extended: true
    - name: Restore Hugo cache
      uses: actions/cache/restore@v6
      with:
        path: |
          ${{ runner.temp }}/hugo_cache
          resources/_gen
        key: hugo-${{ github.run_id }}
        restore-keys: hugo-
    - name: Build site and search index
      run: make publish
      env:
        HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
    - name: Save Hugo cache
      uses: actions/cache/save@v6
      with:
        path: |
          ${{ runner.temp }}/hugo_cache
          resources/_gen
        key: hugo-${{ github.run_id }}
    - name: Deploy
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        publish_dir: ./public
        cname: blog.tobked.dev
